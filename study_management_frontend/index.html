<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Automatically rounds the tab icon corners
      window.addEventListener('DOMContentLoaded', () => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = '/logo.png';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const size = 64;
          canvas.width = size; canvas.height = size;
          const r = 16; // Curve amount
          ctx.beginPath();
          ctx.moveTo(r, 0); ctx.lineTo(size-r, 0); ctx.quadraticCurveTo(size, 0, size, r);
          ctx.lineTo(size, size-r); ctx.quadraticCurveTo(size, size, size-r, size);
          ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size-r);
          ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(img, 0, 0, size, size);
          document.getElementById('favicon').href = canvas.toDataURL('image/png');
        };
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
